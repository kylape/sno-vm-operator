# Administrator policy; no image imports until a tested seed digest is enabled.
namespace: sno-vm-system
binderImage: registry.k8s.io/pause@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
maxConcurrentImports: 1
maxImportAttempts: 3
placements:
  - storageClass: lvms-a100-tier1-storage
    nodeSelector:
      matchExpressions:
        - key: node-role.kubernetes.io/a100-gpu
          operator: Exists
  - storageClass: lvms-b200-gpu-ib-tier1-storage
    nodeSelector:
      matchExpressions:
        - key: node-role.kubernetes.io/b200-gpu-ib
          operator: Exists
images: []
