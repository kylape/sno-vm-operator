# Apply as a cluster administrator to enable the SNO development user's
# VM port-forward and serial-console diagnostics in sno-vm-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sno-vm-operator-user-debug
  namespace: sno-vm-system
  labels:
    app.kubernetes.io/managed-by: sno-vm-operator
rules:
  - apiGroups:
      - subresources.kubevirt.io
    resources:
      - virtualmachines/portforward
      - virtualmachineinstances/console
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sno-vm-operator-user-debug
  namespace: sno-vm-system
  labels:
    app.kubernetes.io/managed-by: sno-vm-operator
subjects:
  - kind: ServiceAccount
    name: sno-vm-operator-user
    namespace: sno-vm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sno-vm-operator-user-debug
